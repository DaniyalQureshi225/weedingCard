<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#240046"/>
      <stop offset="50%" stop-color="#2B0852"/>
      <stop offset="100%" stop-color="#16002E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#E8B923"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(199,125,255,0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="rgba(244,196,48,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F4C430" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="180" fill="none" stroke="rgba(199,125,255,0.08)" stroke-width="1"/>
  <circle cx="1100" cy="550" r="160" fill="none" stroke="rgba(244,196,48,0.06)" stroke-width="1"/>
  <circle cx="600" cy="315" r="280" fill="none" stroke="rgba(244,196,48,0.05)" stroke-width="0.8"/>

  <!-- Stars -->
  <g fill="#FFD166" opacity="0.5">
    <circle cx="120" cy="120" r="2"/><circle cx="280" cy="60" r="1.5"/>
    <circle cx="450" cy="90" r="2"/><circle cx="750" cy="70" r="1.5"/>
    <circle cx="900" cy="110" r="2"/><circle cx="1050" cy="80" r="1.5"/>
    <circle cx="180" cy="520" r="1.5"/><circle cx="350" cy="560" r="2"/>
    <circle cx="850" cy="540" r="1.5"/><circle cx="1020" cy="570" r="2"/>
    <circle cx="200" cy="300" r="1"/><circle cx="1000" cy="280" r="1"/>
    <circle cx="500" cy="520" r="1.2"/><circle cx="700" cy="550" r="1"/>
  </g>

  <!-- Sun emblem -->
  <g transform="translate(600,175)" opacity="0.12" stroke="#F4C430" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(0)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(30)"/>
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(60)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(90)"/>
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(120)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(150)"/>
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(180)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(210)"/>
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(240)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(270)"/>
    <line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(300)"/><line x1="0" y1="-4" x2="0" y2="-36" transform="rotate(330)"/>
    <circle cx="0" cy="0" r="10" fill="#F4C430" opacity="0.3"/>
  </g>

  <!-- Frame border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="rgba(244,196,48,0.25)" stroke-width="1.5"/>
  <rect x="55" y="55" width="1090" height="520" rx="14" fill="none" stroke="rgba(199,125,255,0.2)" stroke-width="1"/>

  <!-- Top ornament line -->
  <line x1="350" y1="130" x2="850" y2="130" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Eyebrow text -->
  <text x="600" y="155" text-anchor="middle" fill="#C77DFF" font-family="Georgia, serif" font-size="13" letter-spacing="5" font-weight="600">TOGETHER WITH THEIR FAMILIES</text>

  <!-- Names -->
  <text x="600" y="240" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" filter="url(#shadow)">Baktawer</text>
  <text x="600" y="300" text-anchor="middle" fill="#F9C5D5" font-family="Georgia, serif" font-size="38" font-style="italic">&amp;</text>
  <text x="600" y="370" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" filter="url(#shadow)">Khizar</text>

  <!-- Divider -->
  <line x1="400" y1="400" x2="800" y2="400" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="600" y="435" text-anchor="middle" fill="#C77DFF" font-family="Georgia, serif" font-size="16" letter-spacing="3" font-weight="500">A Royal Fairytale Wedding</text>

  <!-- Date -->
  <text x="600" y="480" text-anchor="middle" fill="#FFD166" font-family="Georgia, serif" font-size="20" letter-spacing="2" font-weight="600">SUNDAY · OCTOBER 18, 2026</text>

  <!-- Bottom ornament -->
  <line x1="350" y1="510" x2="850" y2="510" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Bottom tagline -->
  <text x="600" y="545" text-anchor="middle" fill="rgba(199,125,255,0.5)" font-family="Georgia, serif" font-size="12" letter-spacing="4">WEEDINGCARDBK.NETLIFY.APP</text>
</svg>